name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Formatage
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Compilation
        run: cargo build --workspace --locked
      - name: Vérifier les vecteurs indépendants du retarget
        run: python3 scripts/retarget_sim.py --check
      - name: Simulation indépendante des émissions 10M / 100M / 500M
        run: |
          python3 -m unittest discover -s scripts -p 'test_emission_sim.py'
          python3 scripts/emission_sim.py --heights 10000000 100000000 500000000
      - name: Tests
        run: cargo test --workspace --locked
      - name: Testnet multi-nœuds
        run: python3 scripts/testnet_smoke.py
      - name: Vérifier le lanceur d’endurance et sa collecte de mesures
        run: python3 scripts/testnet_endurance.py --binary target/debug/aurora-node --wallet target/debug/aurora-wallet --output target/endurance-ci --max-rounds 6 --restart-every 3 --interval-seconds 0
