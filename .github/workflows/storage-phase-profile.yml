name: storage-phase-profile

on:
  push:
    branches: [test/storage-phase-profile-8192, test/storage-profile-2048-8192-ci, test/storage-phase-profile-32768-20261031]
    paths:
      - "crates/aurora-storage/**"
      - ".github/workflows/storage-phase-profile.yml"
  pull_request:
    paths:
      - "crates/aurora-storage/**"
      - ".github/workflows/storage-phase-profile.yml"
  workflow_dispatch:
    inputs:
      blocks:
        description: "Blocks after genesis (256..32768)"
        required: false
        default: "2048"

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Installer Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Précompiler les tests hors des mesures CPU et mémoire
        run: cargo test --locked -p aurora-storage --lib --no-run
      - name: Profiler 2048 puis 8192 blocs sur le même runner
        env:
          AURORA_STORAGE_PROFILE: "1"
          REQUESTED_BLOCKS: ${{ inputs.blocks || '' }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_BLOCKS" ]; then
            case "$REQUESTED_BLOCKS" in
              *[!0-9]*|'') echo "Block count must be a decimal integer" >&2; exit 2 ;;
            esac
            if [ "$REQUESTED_BLOCKS" -lt 256 ] || [ "$REQUESTED_BLOCKS" -gt 32768 ]; then
              echo "Allowed manual block counts: 256..32768" >&2
              exit 2
            fi
            block_counts="$REQUESTED_BLOCKS"
          else
            if [ "$GITHUB_REF" = "refs/heads/test/storage-phase-profile-32768-20261031" ]; then
              block_counts="8192 32768"
            else
              block_counts="2048 8192"
            fi
          fi
          echo "Storage profile volumes: $block_counts"
          for blocks in $block_counts; do
            export AURORA_STORAGE_PROFILE_BLOCKS="$blocks"
            log="storage-profile-${blocks}.log"
            echo "=== Starting $blocks-block storage profile ==="
            /usr/bin/time -v cargo test --locked -p aurora-storage --lib tests::repeated_snapshot_phase_profile_with_restart -- --exact --ignored --nocapture 2>&1 | tee "$log"
            grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' "$log"
            grep -q 'storage phases:' "$log"
            expected_saves=$(((blocks + 63) / 64))
            grep -Eq "storage volume probe: height=${blocks} known_blocks=$((blocks + 1)) snapshot_calls=${expected_saves}([[:space:]]|$)" "$log"
          done
          {
            echo '## Storage phase measurements (single runner, same commit)'
            echo
            for blocks in $block_counts; do
              echo "### ${blocks} blocks"
              echo 'Completed, restored and checked height, tip and block count.'
              grep 'storage phases:' "storage-profile-${blocks}.log" | tail -1
              grep 'storage volume probe:' "storage-profile-${blocks}.log" | tail -1
              grep 'Maximum resident set size' "storage-profile-${blocks}.log" | tail -1
              echo
            done
            echo 'Synthetic Regtest snapshots only; not network sync or a disk-failure test.'
          } | tee storage-profile-summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-phase-evidence
          path: |
            storage-profile-*.log
            storage-profile-summary.md
          retention-days: 14
